<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fare estimator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1c2430;--mute:#5f6b7a;--line:#dde2e9;--accent:#1f4fd8;--accent-ink:#fff;--sel:#eaf0ff;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141a22;--panel:#1c242f;--ink:#e8edf3;--mute:#9aa6b5;--line:#2c3744;--accent:#6b93ff;--accent-ink:#0f1620;--sel:#22304a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:400px 1fr;min-height:100vh}
.panel{background:var(--panel);padding:24px;border-right:1px solid var(--line);overflow-y:auto}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.field{position:relative}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sugg{position:absolute;z-index:1000;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:4px 0 0;padding:4px;list-style:none;max-height:220px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.sugg li{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
.sugg li:hover,.sugg li[aria-selected=true]{background:var(--sel)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.88rem;padding:0}
button.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:.9rem;color:var(--mute);min-height:1.3em}
.msg.err{color:var(--err)}
.trip{display:flex;gap:20px;margin:22px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.trip b{display:block;font-size:1.5rem}
.trip span{color:var(--mute);font-size:.85rem}
.classes{display:grid;gap:8px;margin-top:10px}
.cls{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel);color:inherit;font:inherit;text-align:left;width:100%}
.cls[aria-pressed=true]{border-color:var(--accent);background:var(--sel)}
.cls small{display:block;color:var(--mute)}
.cls .price{font-size:1.25rem;font-weight:700}
.break{margin-top:14px;font-size:.88rem;color:var(--mute)}
.break div{display:flex;justify-content:space-between;padding:3px 0}
.break .tot{color:var(--ink);font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.note{font-size:.78rem;color:var(--mute);margin-top:16px}
#map{min-height:360px;height:100%}
.hidden{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.panel{border-right:0}#map{height:340px;order:-1}}
</style>
</head>
<body>
<div class="app">
  <main class="panel">
    <h1>Fare estimator</h1>
    <p class="sub">Enter a pickup and a drop-off to see the route and the price.</p>

    <label for="from">Pickup</label>
    <div class="field">
      <input id="from" type="text" autocomplete="off" placeholder="Street, area or postcode">
      <ul class="sugg hidden" id="from-s" role="listbox"></ul>
    </div>
    <div class="row"><button class="link" id="locate" type="button">Use my location</button></div>

    <label for="to">Drop-off</label>
    <div class="field">
      <input id="to" type="text" autocomplete="off" placeholder="Street, area or postcode">
      <ul class="sugg hidden" id="to-s" role="listbox"></ul>
    </div>

    <button class="go" id="go" type="button" disabled>Get estimate</button>
    <div class="msg" id="msg" role="status"></div>

    <section id="result" class="hidden">
      <div class="trip">
        <div><b id="dist">-</b><span>distance</span></div>
        <div><b id="time">-</b><span>drive time</span></div>
      </div>
      <div class="classes" id="classes"></div>
      <div class="break" id="break"></div>
    </section>
    <p class="note">Estimates only. The final fare can change with traffic, tolls and route changes.</p>
  </main>
  <div id="map" aria-label="Route map"></div>
</div>

<script>
/* ---------- PRICING: edit these numbers ---------- */
const CONFIG = {
  currency: "£",
  unit: "mi",              // "mi" or "km" - what the per-distance rate below is charged in
  bookingFee: 1.50,        // flat fee added to every ride
  surge: 1.0,              // 1.0 = normal, 1.5 = 50% busier-time uplift
  classes: [               // each class: base fare, rate per distance unit, rate per minute, minimum fare
    {name: "Economy", note: "Up to 4 riders", base: 2.50, perUnit: 1.20, perMin: 0.20, min: 6.00},
    {name: "Comfort", note: "Newer cars, more room", base: 3.20, perUnit: 1.55, perMin: 0.26, min: 8.00},
    {name: "XL",      note: "Up to 6 riders", base: 4.00, perUnit: 1.95, perMin: 0.32, min: 10.00}
  ],
  start: [52.2297, 21.0122], // initial map centre [lat, lon]
  country: ""                // optional ISO code to bias address search, e.g. "gb", "pl"
};
/* ------------------------------------------------- */

const $ = id => document.getElementById(id);
const map = L.map("map").setView(CONFIG.start, 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const pts = {from:null,to:null};
const markers = {};
let routeLayer = null, selected = 0, trip = null;

function money(n){return CONFIG.currency + n.toFixed(2)}
function debounce(fn,ms){let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

async function search(q){
  const p = new URLSearchParams({format:"json",q,limit:"5"});
  if(CONFIG.country) p.set("countrycodes",CONFIG.country);
  const r = await fetch("https://nominatim.openstreetmap.org/search?"+p);
  if(!r.ok) throw new Error("Address search failed");
  return r.json();
}

function setPoint(key,lat,lon,label){
  pts[key] = {lat:+lat,lon:+lon};
  $(key).value = label;
  if(markers[key]) map.removeLayer(markers[key]);
  markers[key] = L.marker([lat,lon],{title:key==="from"?"Pickup":"Drop-off"}).addTo(map);
  map.setView([lat,lon],14);
  $("go").disabled = !(pts.from && pts.to);
}

function wire(key){
  const input = $(key), list = $(key+"-s");
  const run = debounce(async()=>{
    const q = input.value.trim();
    pts[key] = null; $("go").disabled = true;
    if(q.length < 3){list.classList.add("hidden");return}
    try{
      const res = await search(q);
      list.innerHTML = "";
      if(!res.length){list.innerHTML = "<li>No matches. Try adding a town or postcode.</li>"}
      res.forEach(r=>{
        const li = document.createElement("li");
        li.setAttribute("role","option");
        li.textContent = r.display_name;
        li.onclick = ()=>{setPoint(key,r.lat,r.lon,r.display_name);list.classList.add("hidden")};
        list.appendChild(li);
      });
      list.classList.remove("hidden");
    }catch(e){say(e.message,true)}
  },500);
  input.addEventListener("input",run);
  input.addEventListener("keydown",e=>{if(e.key==="Escape")list.classList.add("hidden")});
  document.addEventListener("click",e=>{if(!e.target.closest("#"+key+",#"+key+"-s"))list.classList.add("hidden")});
}
wire("from"); wire("to");

$("locate").onclick = ()=>{
  if(!navigator.geolocation) return say("Location is not available in this browser.",true);
  say("Finding your location...");
  navigator.geolocation.getCurrentPosition(
    p=>{setPoint("from",p.coords.latitude,p.coords.longitude,"My location");say("")},
    ()=>say("Could not get your location. Type an address instead.",true)
  );
};

function say(t,err){const m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}

$("go").onclick = async()=>{
  say("Calculating route...");
  $("go").disabled = true;
  try{
    const u = `https://router.project-osrm.org/route/v1/driving/${pts.from.lon},${pts.from.lat};${pts.to.lon},${pts.to.lat}?overview=full&geometries=geojson`;
    const r = await fetch(u);
    const d = await r.json();
    if(d.code !== "Ok" || !d.routes.length) throw new Error("No driving route found between these places.");
    const rt = d.routes[0];
    trip = {meters:rt.distance, minutes:rt.duration/60};
    if(routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(rt.geometry,{style:{color:"#1f4fd8",weight:5,opacity:.85}}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});
    render();
    say("");
  }catch(e){say(e.message || "Could not calculate the route.",true)}
  $("go").disabled = !(pts.from && pts.to);
};

function fare(c){
  const units = trip.meters / (CONFIG.unit === "mi" ? 1609.344 : 1000);
  const dist = units * c.perUnit, time = trip.minutes * c.perMin;
  const sub = Math.max(c.base + dist + time, c.min);
  const surged = sub * CONFIG.surge;
  return {base:c.base, dist, time, minApplied: (c.base+dist+time) < c.min, sub, surgeAmt: surged-sub, total: surged + CONFIG.bookingFee};
}

function render(){
  const units = trip.meters / (CONFIG.unit === "mi" ? 1609.344 : 1000);
  $("dist").textContent = units.toFixed(1) + " " + CONFIG.unit;
  const m = Math.round(trip.minutes);
  $("time").textContent = m >= 60 ? Math.floor(m/60)+" h "+(m%60)+" min" : m+" min";
  const box = $("classes"); box.innerHTML = "";
  CONFIG.classes.forEach((c,i)=>{
    const f = fare(c), b = document.createElement("button");
    b.type = "button"; b.className = "cls"; b.setAttribute("aria-pressed", i===selected);
    b.innerHTML = `<span><strong>${c.name}</strong><small>${c.note}</small></span><span class="price">${money(f.total)}</span>`;
    b.onclick = ()=>{selected = i; render()};
    box.appendChild(b);
  });
  const c = CONFIG.classes[selected], f = fare(c);
  let h = `<div><span>Base fare</span><span>${money(f.base)}</span></div>
  <div><span>Distance (${money(c.perUnit)} per ${CONFIG.unit})</span><span>${money(f.dist)}</span></div>
  <div><span>Time (${money(c.perMin)} per min)</span><span>${money(f.time)}</span></div>`;
  if(f.minApplied) h += `<div><span>Minimum fare applied</span><span>${money(c.min)}</span></div>`;
  if(CONFIG.surge !== 1) h += `<div><span>Busy-time uplift (x${CONFIG.surge})</span><span>${money(f.surgeAmt)}</span></div>`;
  h += `<div><span>Booking fee</span><span>${money(CONFIG.bookingFee)}</span></div>
  <div class="tot"><span>${c.name} estimate</span><span>${money(f.total)}</span></div>`;
  $("break").innerHTML = h;
  $("result").classList.remove("hidden");
}
</script>
</body>
</html>
